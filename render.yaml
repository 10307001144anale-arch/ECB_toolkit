# Render Blueprint for CertiGen. In Render: New → Blueprint → pick this repository.
services:
  - type: web
    name: certigen
    runtime: node
    region: singapore          # closest Render region to Bhutan
    plan: free                 # data lives in Supabase, so no disk is needed
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true           # every push to main redeploys
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SUPABASE_DB_URL
        sync: false            # Supabase → Connect → Session pooler
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TRUST_PROXY
        value: "true"
      - key: APP_SECRET
        generateValue: true    # Render creates a random secret
      - key: ADMIN_EMAIL
        sync: false            # you enter these once in the Render dashboard
      - key: ADMIN_PASSWORD
        sync: false
